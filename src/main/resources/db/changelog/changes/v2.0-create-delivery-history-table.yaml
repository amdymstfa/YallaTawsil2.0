databaseChangeLog:
  - changeSet:
      id: create-delivery-history-table
      author: moustapha
      changes:
        - createTable:
            tableName: delivery_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tour_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: delivery_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: delivery_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: planned_time
                  type: TIME
              - column:
                  name: actual_time
                  type: TIME
              - column:
                  name: delay_minutes
                  type: INTEGER
              - column:
                  name: day_of_week
                  type: VARCHAR(20)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: delivery_history
            baseColumnNames: customer_id
            referencedTableName: customers
            referencedColumnNames: id
            constraintName: fk_history_customer
        - addForeignKeyConstraint:
            baseTableName: delivery_history
            baseColumnNames: tour_id
            referencedTableName: tours
            referencedColumnNames: id
            constraintName: fk_history_tour
        - addForeignKeyConstraint:
            baseTableName: delivery_history
            baseColumnNames: delivery_id
            referencedTableName: deliveries
            referencedColumnNames: id
            constraintName: fk_history_delivery
      rollback:
        - dropTable:
            tableName: delivery_history