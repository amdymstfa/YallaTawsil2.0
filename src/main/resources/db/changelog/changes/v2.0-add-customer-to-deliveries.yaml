databaseChangeLog:
  - changeSet:
      id: add-customer-id-to-deliveries
      author: moustapha
      changes:
        - addColumn:
            tableName: deliveries
            columns:
              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: deliveries
            baseColumnNames: customer_id
            referencedTableName: customers
            referencedColumnNames: id
            constraintName: fk_delivery_customer
            onDelete: CASCADE
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: deliveries
            constraintName: fk_delivery_customer
        - dropColumn:
            tableName: deliveries
            columnName: customer_id